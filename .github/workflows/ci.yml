name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Install Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('Cargo.toml') }}

      # On pushes: strict check. On PRs: run rustfmt and push the canonical
      # formatting back to the PR branch if it drifted (the runner's tree is
      # fixed for the remaining steps either way). Requires contents: write.
      - name: Formatting
        if: github.event_name == 'push'
        run: cargo fmt --all -- --check

      - name: Formatting (auto-fix)
        if: github.event_name == 'pull_request'
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo 'formatting OK'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -am 'style: cargo fmt'
            git push origin 'HEAD:${{ github.event.pull_request.head.ref }}'
          fi

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (debug)
        run: cargo build

      - name: Build (release)
        run: cargo build --release

      - name: Unit tests
        run: cargo test

      - name: Smoke test against 127.0.0.1
        run: |
          python3 -m http.server 18099 --bind 127.0.0.1 &
          SERVER_PID=$!
          sleep 1
          ./target/release/gaspscan scan 127.0.0.1 --ports 18099 --json
          ./target/release/gaspscan scan 127.0.0.1 --ports 1-1024 --threads 64
          kill $SERVER_PID
